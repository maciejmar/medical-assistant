name: logoped-assist

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logoped}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w pliku .env}
      POSTGRES_DB: ${POSTGRES_DB:-logoped}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logoped} -d ${POSTGRES_DB:-logoped}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [logoped_net]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [logoped_net]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: postgresql+asyncpg://${POSTGRES_USER:-logoped}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-logoped}
      QDRANT_URL: http://qdrant:6333
      HF_HOME: /models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - model_cache:/models
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [logoped_net]

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [logoped_net]

networks:
  logoped_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
